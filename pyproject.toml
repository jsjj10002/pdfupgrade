[project]
name = "pdfupgrade"
version = "1.0.0"
description = "AI-powered PDF quality enhancement platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PDF Upgrade Team" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "pymupdf>=1.24.0",
    "pikepdf>=9.2.0",
    "pillow>=10.4.0",
    "numpy>=2.1.0",
    "opencv-python>=4.10.0",
    "torch>=2.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

ai = [
    # AI 모델 관련 의존성
    "realesrgan>=0.3.0",  # Sprint 2: 업스케일
    "basicsr>=1.4.2",     # Real-ESRGAN 의존성
    "facexlib>=0.3.0",    # GFPGAN 의존성
    "gfpgan>=1.3.8",      # Sprint 2: 얼굴 보정 (선택)
    # "paddleocr>=2.7.0",  # Sprint 3: OCR (향후)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=html --cov-report=term-missing"
